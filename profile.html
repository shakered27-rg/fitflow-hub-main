<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Profile - FitnessTracker</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <a href="dashboard.html" class="nav-item">
                <span class="nav-icon">📊</span>
                <span class="nav-label">Dashboard</span>
            </a>
            <a href="workouts.html" class="nav-item">
                <span class="nav-icon">🏋️</span>
                <span class="nav-label">Workouts</span>
            </a>
            <a href="goals.html" class="nav-item">
                <span class="nav-icon">🎯</span>
                <span class="nav-label">Goals</span>
            </a>
            <a href="notifications.html" class="nav-item">
                <span class="nav-icon">🔔</span>
                <span class="nav-label">Notifications</span>
            </a>
            <a href="profile.html" class="nav-item active">
                <span class="nav-icon">👤</span>
                <span class="nav-label">Profile</span>
            </a>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <div class="profile-header">
                <h1>👤 My Profile</h1>
                <button id="edit-profile-btn" class="add-btn" onclick="toggleEdit()">
                    <span>✏️</span> Edit Profile
                </button>
            </div>

            <!-- Profile View Mode -->
            <div id="profile-view">
                <div class="profile-picture-section">
                    <div class="profile-picture">
                        <img id="profile-img" src="https://via.placeholder.com/150" alt="Profile Picture">
                    </div>
                    <h2 id="profile-name" style="margin-top: 16px;">User Name</h2>
                    <p id="profile-email" style="color: var(--text-light);">email@example.com</p>
                    <p id="profile-fitness-level" style="display: inline-block; padding: 4px 12px; background: var(--primary-light); color: var(--primary-dark); border-radius: 20px; margin-top: 8px;">Beginner</p>
                </div>

                <div class="profile-stats">
                    <div class="stat-box">
                        <div class="stat-number" id="stat-workouts">0</div>
                        <div class="stat-label">Workouts</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-number" id="stat-goals">0</div>
                        <div class="stat-label">Goals</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-number" id="stat-streak">0</div>
                        <div class="stat-label">Day Streak</div>
                    </div>
                </div>

                <div style="background: var(--bg-white); border-radius: var(--border-radius); padding: 24px; margin-top: 24px;">
                    <h3 style="margin-bottom: 20px;">📋 Personal Information</h3>
                    <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px;">
                        <div>
                            <p style="color: var(--text-light); font-size: 12px; margin-bottom: 4px;">Age</p>
                            <p id="profile-age" style="font-weight: 600;">Not set</p>
                        </div>
                        <div>
                            <p style="color: var(--text-light); font-size: 12px; margin-bottom: 4px;">Gender</p>
                            <p id="profile-gender" style="font-weight: 600;">Not set</p>
                        </div>
                        <div>
                            <p style="color: var(--text-light); font-size: 12px; margin-bottom: 4px;">Height</p>
                            <p id="profile-height" style="font-weight: 600;">Not set</p>
                        </div>
                        <div>
                            <p style="color: var(--text-light); font-size: 12px; margin-bottom: 4px;">Weight</p>
                            <p id="profile-weight" style="font-weight: 600;">Not set</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Profile Edit Mode -->
            <div id="profile-edit" style="display: none;">
                <div class="profile-picture-section">
                    <div class="profile-picture">
                        <img id="profile-img-preview" src="https://via.placeholder.com/150" alt="Profile Picture Preview">
                    </div>
                    <div class="upload-btn-wrapper" style="margin-top: 16px;">
                        <button class="add-btn" style="background: var(--bg-light); color: var(--text-dark);">
                            <span>📸</span> Change Photo
                        </button>
                        <input type="file" id="profile-picture" accept="image/*" style="position: absolute; left: 0; top: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer;" onchange="handleProfilePictureUpload()">
                    </div>
                </div>

                <form id="profile-form" style="margin-top: 32px;">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="full-name" placeholder="Enter your full name">
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Age</label>
                            <input type="number" id="age" placeholder="Age" min="1" max="120">
                        </div>
                        <div class="form-group">
                            <label>Gender</label>
                            <select id="gender">
                                <option value="">Select gender</option>
                                <option value="male">Male</option>
                                <option value="female">Female</option>
                                <option value="other">Other</option>
                                <option value="prefer-not">Prefer not to say</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Height (cm)</label>
                            <input type="number" id="height" placeholder="Height in cm" min="100" max="250">
                        </div>
                        <div class="form-group">
                            <label>Weight (kg)</label>
                            <input type="number" id="weight" placeholder="Weight in kg" min="30" max="200" step="0.1">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Fitness Level</label>
                        <select id="fitness-level">
                            <option value="beginner">Beginner</option>
                            <option value="intermediate">Intermediate</option>
                            <option value="advanced">Advanced</option>
                            <option value="athlete">Athlete</option>
                        </select>
                    </div>

                    <div style="display: flex; gap: 16px; margin-top: 32px;">
                        <button type="button" onclick="saveProfile()" style="flex: 2; padding: 14px; background: var(--primary-color); color: white; border: none; border-radius: var(--border-radius-sm); cursor: pointer; font-weight: 600;">
                            Save Changes
                        </button>
                        <button type="button" onclick="toggleEdit()" style="flex: 1; padding: 14px; background: var(--bg-light); color: var(--text-dark); border: none; border-radius: var(--border-radius-sm); cursor: pointer;">
                            Cancel
                        </button>
                    </div>
                </form>
            </div>

            <!-- Logout Button -->
            <div style="margin-top: 32px; text-align: center;">
                <button id="logout-btn" onclick="handleLogout()" style="padding: 12px 24px; background: none; border: 2px solid var(--danger-color); color: var(--danger-color); border-radius: var(--border-radius-sm); cursor: pointer; font-weight: 600;">
                    🚪 Logout
                </button>
            </div>
        </main>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-storage-compat.js"></script>
    
    <!-- App Scripts -->
    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/profile.js"></script>
</body>
</html>
