<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Workouts - FitnessTracker</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <a href="dashboard.html" class="nav-item">
                <span class="nav-icon">📊</span>
                <span class="nav-label">Dashboard</span>
            </a>
            <a href="workouts.html" class="nav-item active">
                <span class="nav-icon">🏋️</span>
                <span class="nav-label">Workouts</span>
            </a>
            <a href="goals.html" class="nav-item">
                <span class="nav-icon">🎯</span>
                <span class="nav-label">Goals</span>
            </a>
            <a href="notifications.html" class="nav-item">
                <span class="nav-icon">🔔</span>
                <span class="nav-label">Notifications</span>
            </a>
            <a href="profile.html" class="nav-item">
                <span class="nav-icon">👤</span>
                <span class="nav-label">Profile</span>
            </a>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <div class="page-header">
                <h1>🏋️ Workouts</h1>
                <button class="add-btn" onclick="openWorkoutModal()">
                    <span>➕</span> Add Workout
                </button>
            </div>

            <!-- Workout Categories Filter -->
            <div class="workout-categories" style="display: flex; gap: 10px; margin-bottom: 24px; overflow-x: auto; padding-bottom: 8px;">
                <button class="category-filter active" onclick="filterWorkouts('all')" style="padding: 8px 16px; border: none; background: var(--primary-color); color: white; border-radius: 20px; cursor: pointer;">All</button>
                <button class="category-filter" onclick="filterWorkouts('strength')" style="padding: 8px 16px; border: 2px solid var(--border-color); background: var(--bg-white); color: var(--text-dark); border-radius: 20px; cursor: pointer;">Strength</button>
                <button class="category-filter" onclick="filterWorkouts('cardio')" style="padding: 8px 16px; border: 2px solid var(--border-color); background: var(--bg-white); color: var(--text-dark); border-radius: 20px; cursor: pointer;">Cardio</button>
                <button class="category-filter" onclick="filterWorkouts('flexibility')" style="padding: 8px 16px; border: 2px solid var(--border-color); background: var(--bg-white); color: var(--text-dark); border-radius: 20px; cursor: pointer;">Flexibility</button>
                <button class="category-filter" onclick="filterWorkouts('hiit')" style="padding: 8px 16px; border: 2px solid var(--border-color); background: var(--bg-white); color: var(--text-dark); border-radius: 20px; cursor: pointer;">HIIT</button>
                <button class="category-filter" onclick="filterWorkouts('yoga')" style="padding: 8px 16px; border: 2px solid var(--border-color); background: var(--bg-white); color: var(--text-dark); border-radius: 20px; cursor: pointer;">Yoga</button>
            </div>

            <!-- Workouts List -->
            <div id="workouts-list" class="workouts-list">
                <!-- Dynamic content will be inserted here -->
            </div>
        </main>
    </div>

    <!-- Add/Edit Workout Modal -->
    <div id="workout-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">Add New Workout</h2>
                <button class="close-btn" onclick="closeWorkoutModal()">&times;</button>
            </div>
            <form id="workout-form">
                <div class="form-group">
                    <label>Workout Name</label>
                    <input type="text" id="workout-name" required placeholder="e.g., Morning Run">
                </div>

                <div class="form-group">
                    <label>Category</label>
                    <select id="workout-category" required>
                        <option value="strength">💪 Strength</option>
                        <option value="cardio">🏃 Cardio</option>
                        <option value="flexibility">🧘 Flexibility</option>
                        <option value="hiit">⚡ HIIT</option>
                        <option value="yoga">🧘‍♀️ Yoga</option>
                    </select>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Duration (min)</label>
                        <input type="number" id="workout-duration" required min="1" placeholder="30">
                    </div>
                    <div class="form-group">
                        <label>Date</label>
                        <input type="date" id="workout-date" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Sets</label>
                        <input type="number" id="workout-sets" min="1" placeholder="3">
                    </div>
                    <div class="form-group">
                        <label>Reps</label>
                        <input type="number" id="workout-reps" min="1" placeholder="12">
                    </div>
                    <div class="form-group">
                        <label>Weight (kg)</label>
                        <input type="number" id="workout-weight" min="0" step="0.5" placeholder="50">
                    </div>
                </div>

                <div class="form-actions" style="display: flex; gap: 16px; margin-top: 24px;">
                    <button type="submit" class="submit-btn" id="submit-workout" style="flex: 2; padding: 12px; background: var(--primary-color); color: white; border: none; border-radius: var(--border-radius-sm); cursor: pointer;">Add Workout</button>
                    <button type="button" class="cancel-btn" onclick="closeWorkoutModal()" style="flex: 1; padding: 12px; background: var(--bg-light); color: var(--text-dark); border: none; border-radius: var(--border-radius-sm); cursor: pointer;">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-firestore-compat.js"></script>
    
    <!-- App Scripts -->
    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/workouts.js"></script>
</body>
</html>
